<div class="input-group">
  <label class="input-label">Horarios disponibles para el {{ selectedFecha ? (selectedFecha + 'T00:00:00' | date: 'dd/MM/yyyy') : '' }}</label>

  <!-- Estado de carga -->
  <small *ngIf="loading" class="text-muted">Cargando horarios...</small>

  <!-- Error o barbero sin turno -->
  <small *ngIf="!loading && error" class="text-danger">{{ error }}</small>

  <small *ngIf="!loading && !error && slots.length === 0" class="text-muted">
    No hay franjas para este día. Elige otra fecha.
  </small>

  <div class="slots-container" *ngIf="!loading && slots.length" role="group" aria-label="Franjas horarias">
    <button
      type="button"
      *ngFor="let slot of slots"
      class="slot-btn"
      [class.active]="selectedHora === slot.hora"
      [class.disabled]="!slot.disponible"
      [disabled]="!slot.disponible"
      [attr.aria-pressed]="selectedHora === slot.hora"
      (click)="horaSeleccionada.emit(slot)"
    >
      <span class="slot-hora">{{ slot.hora }}</span>
      <span class="slot-motivo" *ngIf="!slot.disponible">{{ slot.motivoOcupado }}</span>
    </button>
  </div>
</div>
