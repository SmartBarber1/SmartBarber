<div class="services-section mt-4">
  <p class="section-title" id="servicios-titulo">Servicios Disponibles *</p>

  <!-- Estado de carga de servicios -->
  <div *ngIf="loading" class="text-center py-3">
    <small class="text-muted">Cargando servicios de la sede...</small>
  </div>

  <!-- Mensaje si no hay servicios -->
  <div *ngIf="!loading && servicios.length === 0" class="alert alert-warning py-2 text-center">
    <small>No hay servicios disponibles para esta barbería.</small>
  </div>

  <!-- Lista de servicios -->
  <div *ngIf="!loading && servicios.length > 0" class="services-grid" role="group" aria-labelledby="servicios-titulo">
    <label
      *ngFor="let servicio of servicios"
      class="service-card"
      [class.selected]="isSelected(servicio.id)"
      [for]="'servicio-' + servicio.id"
    >
      <span class="service-info">
        <span class="service-name-row">
          <input
            type="checkbox"
            [id]="'servicio-' + servicio.id"
            [checked]="isSelected(servicio.id)"
            (change)="servicioToggle.emit(servicio)"
            class="service-checkbox"
          />
          <span class="service-name">{{ servicio.name }}</span>
        </span>
        <span class="service-desc" *ngIf="servicio.description">{{ servicio.description }}</span>
        <span class="service-duration" *ngIf="servicio.duration">
          <span aria-hidden="true">⏱️</span> {{ servicio.duration }} min
        </span>
      </span>

      <span class="service-price-badge">
        <span class="price-amount">COP {{ (servicio.special_price || servicio.price) | number }}</span>
        <small class="old-price" *ngIf="servicio.offert && servicio.special_price && servicio.price > servicio.special_price">
          <span class="visually-hidden">Precio anterior: </span>COP {{ servicio.price | number }}
        </small>
      </span>
    </label>
  </div>
</div>
