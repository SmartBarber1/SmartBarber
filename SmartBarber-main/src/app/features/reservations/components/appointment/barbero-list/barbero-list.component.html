<div class="barberos-grid" role="group" *ngIf="!loading && !error" aria-label="Barberos disponibles">
  <button
    type="button"
    *ngFor="let barbero of barberos"
    class="barber-card"
    [class.selected]="selected?.id === barbero.id"
    [attr.aria-pressed]="selected?.id === barbero.id"
    [disabled]="locked && selected?.id !== barbero.id"
    (click)="barberoSeleccionado.emit(barbero)"
  >
    <div class="barber-avatar-container">
      <img [src]="barbero.foto" [alt]="barbero.name" class="barber-img" />
    </div>
    <div class="barber-info">
      <h4 class="barber-name">{{ barbero.name }}</h4>
      <p class="barber-spec">{{ barbero.especialidad }}</p>
      <div class="barber-status">
        <span class="status-dot" [ngClass]="barbero.estado"></span>
        <span class="status-text">{{ barbero.estadoTexto }}</span>
      </div>
    </div>
  </button>
</div>

<p class="barbers-empty" *ngIf="loading" aria-busy="true">Cargando barberos…</p>

<div class="barbers-empty barbers-empty--error" *ngIf="!loading && error" role="alert">
  <span>{{ error }}</span>
  <button type="button" class="barbers-retry" (click)="reintentar.emit()">Reintentar</button>
</div>

<p class="barbers-empty" *ngIf="!loading && !error && barberos.length === 0">
  Esta barbería aún no tiene barberos disponibles para reservar. Prueba con otra barbería o vuelve más tarde.
</p>
