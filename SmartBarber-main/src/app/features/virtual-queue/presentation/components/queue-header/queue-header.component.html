    <header class="queue-header">
      <div class="queue-heading">
        <p class="eyebrow">GESTIÓN DE ATENCIÓN</p>
        <h1 id="queue-title">Cola virtual</h1>
        <p class="queue-subtitle">
          Administra los turnos y mantén el flujo de atención de tu barbería al día.
        </p>
      </div>
 
      <button
        type="button"
        class="refresh-button"
        [disabled]="loading || actionLoading"
        (click)="onRefresh()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 7v5h-5M4 17v-5h5"></path>
          <path d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"></path>
        </svg>
        <span>Actualizar</span>
      </button>
    </header>
