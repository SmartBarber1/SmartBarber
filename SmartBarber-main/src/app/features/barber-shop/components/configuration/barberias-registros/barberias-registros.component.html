<div class="editor">

  <p class="editor-intro">Actualiza los datos generales de tu barbería. Los campos con error se marcan debajo.</p>

  <form
    *ngIf="isEditing"
    [formGroup]="infoForm"
    (ngSubmit)="saveGeneralConfig()"
    class="editor-form"
  >

    <div class="form-field">

      <label for="nombre">
        Nombre del establecimiento
      </label>

      <input
        id="nombre"
        type="text"
        formControlName="nombre"
        placeholder="Ej. Smart Barber"
      />

      <small *ngIf="fieldError('nombre') as msg" role="alert">{{ msg }}</small>

    </div>


    <div class="form-field">

      <label for="razonSocial">
        Razón social
      </label>

      <input
        id="razonSocial"
        type="text"
        formControlName="razonSocial"
        [attr.aria-invalid]="fieldError('razonSocial') ? true : null"
        placeholder="Ej. Smart Barber S.A.S."
      />

        <small *ngIf="fieldError('razonSocial') as msg" role="alert">{{ msg }}</small>

    </div>


    <div class="form-row">

      <div class="form-field">

        <label for="tipoDocumento">
          Tipo de documento
        </label>

        <select
          id="tipoDocumento"
          formControlName="tipoDocumento"
        [attr.aria-invalid]="fieldError('tipoDocumento') ? true : null"
        >

          <option value="">
            Selecciona
          </option>

          <option value="NIT">
            NIT
          </option>

          <option value="CC">
            CC
          </option>

          <option value="CE">
            CE
          </option>

        </select>

        <small *ngIf="fieldError('tipoDocumento') as msg" role="alert">{{ msg }}</small>

      </div>


      <div class="form-field">

        <label for="documento">
          Documento
        </label>

        <input
          id="documento"
          type="text"
          formControlName="documento"
        [attr.aria-invalid]="fieldError('documento') ? true : null"
          placeholder="Ej. 900123456-1"
        />

        <small *ngIf="fieldError('documento') as msg" role="alert">{{ msg }}</small>

      </div>

    </div>


    <div class="form-field">

      <label for="telefono">
        Teléfono
      </label>

      <input
        id="telefono"
        type="text"
        formControlName="telefono"
        [attr.aria-invalid]="fieldError('telefono') ? true : null"
        placeholder="Ej. 3001234567"
        inputmode="numeric"
        maxlength="10"
      />

        <small *ngIf="fieldError('telefono') as msg" role="alert">{{ msg }}</small>

    </div>


    <div class="form-field">

      <label for="ubicacion">
        Ubicación
      </label>

      <input
        id="ubicacion"
        type="text"
        formControlName="ubicacion"
        [attr.aria-invalid]="fieldError('ubicacion') ? true : null"
        placeholder="Ej. Soacha, Cundinamarca"
      />

        <small *ngIf="fieldError('ubicacion') as msg" role="alert">{{ msg }}</small>

    </div>


    <div class="form-field">

      <label for="descripcion">
        Descripción
      </label>

      <textarea
        id="descripcion"
        formControlName="descripcion"
        [attr.aria-invalid]="fieldError('descripcion') ? true : null"
        rows="3"
        placeholder="Describe brevemente tu establecimiento..."
      ></textarea>

        <small *ngIf="fieldError('descripcion') as msg" role="alert">{{ msg }}</small>

    </div>


    <div
      class="form-error"
      *ngIf="formError"
    >
      {{ formError }}
    </div>


    <div class="form-actions">

      <button
        type="button"
        class="button-secondary"
        (click)="cancelEdit()"
        [disabled]="saving"
      >
        Cancelar
      </button>


      <button
        type="submit"
        class="button-primary"
        [disabled]="
          infoForm.invalid ||
          saving
        "
      >

        {{
          saving
            ? 'GUARDANDO...'
            : 'GUARDAR CAMBIOS'
        }}

      </button>

    </div>

  </form>

</div>
