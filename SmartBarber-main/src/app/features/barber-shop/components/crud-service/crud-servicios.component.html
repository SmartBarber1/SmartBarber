<div class="crud-wrapper">

  <div *ngIf="aviso" class="page-notice" [class.page-notice--error]="aviso.tipo === 'error'"
    [attr.role]="aviso.tipo === 'error' ? 'alert' : 'status'">
    <span>{{ aviso.texto }}</span>
    <button type="button" class="page-notice__close" (click)="cerrarAviso()" aria-label="Cerrar aviso">✕</button>
  </div>

  <!-- Tarjeta dividida en 2 columnas -->
  <main class="crud-card">

    <!-- Lado izquierdo: formulario de creación / modificación -->
    <app-servicio-form
      [barberiaId]="currentBarberiaId"
      [editando]="editando"
      (guardar)="saveService($event)"
      (cancelar)="cancelEdit()">
    </app-servicio-form>

    <!-- Lado derecho: catálogo de servicios -->
    <section class="list-section">
      <div class="list-header">
        <h2>Catálogo de Servicios</h2>
        <span class="counter-badge">
          {{ cargando ? 'Cargando…' : servicesList.length + (servicesList.length === 1 ? ' registrado' : ' registrados') }}
        </span>
      </div>


      <app-catalogo-servicios
        [servicios]="servicesList"
        [cargando]="cargando"
        [ocupadoId]="ocupadoId"
        (editar)="editService($event)"
        (alternarEstado)="toggleServiceStatus($event)"
        (eliminar)="deleteService($event)">
      </app-catalogo-servicios>
    </section>

  </main>
</div>
